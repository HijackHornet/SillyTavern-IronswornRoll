<div id="ironsworn-roll-settings" class="inline-drawer ironsworn-roll-settings">
    <div class="inline-drawer-toggle inline-drawer-header">
        <b>Ironsworn Roll</b>
        <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
        <label class="checkbox_label" for="ironsworn-autoRoll">
            <input id="ironsworn-autoRoll" type="checkbox" data-ironsworn-setting="autoRoll">
            <span>Auto roll</span>
        </label>
        <label class="checkbox_label" for="ironsworn-playSfx">
            <input id="ironsworn-playSfx" type="checkbox" data-ironsworn-setting="playSfx">
            <span>Play sound effects</span>
        </label>
        <label class="checkbox_label" for="ironsworn-autoContinue">
            <input id="ironsworn-autoContinue" type="checkbox" data-ironsworn-setting="autoContinue">
            <span>Auto continue on strong hit or when momentum cannot be used</span>
        </label>
    </div>
</div>
